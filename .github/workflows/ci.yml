name: CI

on:
  push:
    branches: [main]
  pull_request:

# Everything runs from uv.lock (`--locked` fails if the lock is out of date), so CI uses the
# same versions as `make lint` / `make test` on a developer machine.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: make lint

  test-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev --extra bench --extra parity
      - run: make test
